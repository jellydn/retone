name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Renovate bumps the Rune dependencies but not [patch.crates-io]; a split once broke main (#22).
      - name: One Rune revision in Cargo.toml
        run: |
          revs=$(grep -o 'anomalyco/rune", rev = "[0-9a-f]*"' Cargo.toml | sort | uniq -c)
          echo "$revs"
          test "$(echo "$revs" | grep -c .)" -eq 1
      - name: Install pinned Rust
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: Build and package test app
        run: sh scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retone-macos-arm64-${{ github.sha }}
          path: target/release/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
