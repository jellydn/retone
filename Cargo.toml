[package]
name = "retone"
version = "0.1.0-beta.13"
edition = "2024"
license = "MIT"
description = "Retone for macOS: rewrite the selected text in any app with your own hotkey"
publish = false

[dependencies]
# One Rune `dev` revision for Rune and every patch below; bump them together.
rune = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
rune-core = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP, or HTTPS through native-tls and the macOS trust store, for local and private-network servers (ADR 0006).
ureq = { version = "3", default-features = false, features = ["json", "native-tls-no-default"] }
# Already in the tree through native-tls; Retone uses its safe Keychain API for the llama-server key.
security-framework = "3"

[build-dependencies]
# Turns locales/ into the message catalog at build time.
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0", features = ["codegen"] }

# Same objc2 family versions as Rune's lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSArray", "NSData", "NSString", "NSURL", "NSGeometry", "NSValue", "NSDictionary", "NSObject", "NSBundle"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSEvent", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSWorkspace", "NSImage", "NSCell"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFString", "CFArray", "CFBase", "CFNumber", "CFDictionary", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "AXUIElement", "AXValue", "AXError", "AXAttributeConstants", "AXRoleConstants", "AXValueConstants", "HIServices", "libc", "objc2-core-graphics"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "03a370580cf1ab28cf55d2f16d6dd90665ba11a0" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# Only the FFI leaf modules under src/mac/ opt in, each block with a SAFETY comment.
unsafe_code = "deny"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
